# EverFrost relay - reads an Anker EverFrost Powered Cooler 40 over Bluetooth and serves it over Wi-Fi.
# Flash over Wi-Fi: esphome upload everfrost-relay.yaml --device everfrost-relay.local
# Live readings and logs: http://everfrost-relay.local
#
# Protocol (confirmed on the 40, matches the EverFrost 30 layout):
#   service 0x0157F5DA, write 0x7777 (no response), notify 0x8888.
#   Status request 08 EE 00 00 00 01 01 0A 00 02 -> 54-byte reply starting 09 FF, byte 7 = length,
#   last byte = sum of the others mod 256. Byte 13 battery %, 17 current temp, 18 target temp (degF + 128).
# Read-only: the only thing ever sent is the status request above.

esphome:
  name: everfrost-relay
  friendly_name: EverFrost Relay
  project:
    name: tapiocateeh.everfrost-relay
    version: "1.0.0"

# Announces this config over mDNS so ESPHome Builder lists the device under "Discovered" and can adopt it.
dashboard_import:
  package_import_url: github://tapiocateeh/everfrost-relay/everfrost-relay.yaml@main

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "everfrost-relay-setup"
  on_connect:
    - output.turn_on: wifi_led
  on_disconnect:
    - output.turn_off: wifi_led

# Onboard blue LED (GPIO2 on esp32dev boards): lit while Wi-Fi is connected.
output:
  - platform: gpio
    pin: GPIO2
    id: wifi_led

ota:
  - platform: esphome

# Home Assistant native API (HA: Settings > Devices & services > ESPHome, host everfrost-relay.local or its IP).
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s   # default reboots after 15 min with no HA client; don't, the cooler monitor works standalone

web_server:
  port: 80

# MQTT: state topics under everfrost-relay/... (e.g. everfrost-relay/sensor/cooler_temperature/state).
# HA discovery is off because HA already gets these entities via the native API above - avoids duplicates.
mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  discovery: false

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: E8:EE:CC:5A:3F:29
    id: cooler
    on_connect:
      then:
        - logger.log: {format: "Connected to cooler", tag: everfrost, level: INFO}
    on_disconnect:
      then:
        - logger.log: {format: "Disconnected from cooler", tag: everfrost, level: WARN}
        # Don't leave stale numbers on display while we can't hear the cooler.
        - lambda: |-
            id(cooler_battery).publish_state(NAN);
            id(cooler_temp).publish_state(NAN);
            id(cooler_target).publish_state(NAN);

interval:
  # Ask the cooler for its status every 30 s (query only - no settings are changed).
  - interval: 30s
    then:
      - if:
          condition:
            lambda: 'return id(cooler)->connected();'
          then:
            - ble_client.ble_write:
                id: cooler
                service_uuid: "0157F5DA"
                characteristic_uuid: "7777"
                value: [0x08, 0xEE, 0x00, 0x00, 0x00, 0x01, 0x01, 0x0A, 0x00, 0x02]

binary_sensor:
  - platform: template
    name: "MQTT connected"
    device_class: connectivity
    entity_category: diagnostic
    lambda: 'return mqtt::global_mqtt_client != nullptr && mqtt::global_mqtt_client->is_connected();'
  - platform: template
    name: "Cooler connected"
    device_class: connectivity
    lambda: 'return id(cooler)->connected();'

text_sensor:
  # Last full status packet as hex - handy for mapping the bytes we don't understand yet.
  - platform: template
    id: cooler_raw
    name: "Cooler raw status"
    entity_category: diagnostic

sensor:
  # Receives everything the cooler pushes on 0x8888 and fans the status packet out to the sensors below.
  - platform: ble_client
    type: characteristic
    ble_client_id: cooler
    id: cooler_rx
    internal: true
    service_uuid: "0157F5DA"
    characteristic_uuid: "8888"
    notify: true
    update_interval: never
    lambda: |-
      std::string hex;
      char b[4];
      for (size_t i = 0; i < x.size(); i++) {
        snprintf(b, sizeof(b), "%02X ", x[i]);
        hex += b;
      }
      ESP_LOGD("cooler_rx", "%u bytes: %s", (unsigned) x.size(), hex.c_str());

      // Only the full status packet: 09 FF header, length byte matches, checksum good.
      if (x.size() < 19 || x[0] != 0x09 || x[1] != 0xFF || x[7] != x.size()) return NAN;
      uint8_t sum = 0;
      for (size_t i = 0; i + 1 < x.size(); i++) sum += x[i];
      if (sum != x.back()) {
        ESP_LOGW("cooler_rx", "checksum mismatch (got %02X, expected %02X) - packet ignored", x.back(), sum);
        return NAN;
      }

      id(cooler_battery).publish_state(x[13]);
      id(cooler_temp).publish_state((int) x[17] - 128);
      id(cooler_target).publish_state((int) x[18] - 128);
      if (id(cooler_raw).state != hex) id(cooler_raw).publish_state(hex);
      return (float) x.size();

  - platform: template
    id: cooler_battery
    name: "Cooler battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    id: cooler_temp
    name: "Cooler temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 0

  - platform: template
    id: cooler_target
    name: "Cooler target temperature"
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0

  # Signal strength of the live connection.
  - platform: ble_client
    type: rssi
    ble_client_id: cooler
    name: "Cooler signal"
    entity_category: diagnostic
    update_interval: 60s
